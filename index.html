<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akan Name Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

     <h1>Akan Name Generator</h1>
      <div class="star">★</div>

    <form id="akanForm">
        <label for="dayOfWeek">Select your day of birth:</label>
        <select id="dayOfWeek" name="dayOfWeek" required>
            <option value="">Please choose an option</option>
            <option value="0">Sunday</option>
            <option value="1">Monday</option>
            <option value="2">Tuesday</option>
            <option value="3">Wednesday</option>
            <option value="4">Thursday</option>
            <option value="5">Friday</option>
            <option value="6">Saturday</option>
        </select>

        <label for="gender">Select your gender:</label>
        <select id="gender" name="gender" required>
            <option value="">Please choose an option</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
        <input type="number" id="day" placeholder="Day" required>
        <input type="number" id="month" placeholder="Month" required>
        <input type="number" id="year" placeholder="Year" required>
          </select>
              <section class="result"> 
         <h2>Your Akan Name:</h2>
         <p id="result">Your generated Akan name will appear here...</p>
        </section>
        <p id="result"></p>
        <button type="submit">Generate Akan Name</button>
    </form>
    
    <script src="script.js"></script>
</body>
</html>
